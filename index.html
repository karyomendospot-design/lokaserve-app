<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LokaServe Mainnet</title>
<script src="https://minepi.com"></script>
<style>
body{font-family:sans-serif;background:#f4f4f9;margin:0;padding:12px;color:#333}
.box{max-width:460px;margin:auto;background:#fff;padding:16px;border-radius:12px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:8px}
h1{color:#593B8B;font-size:19px;margin:0}
.tag{background:#d1e7dd;color:#0f5132;font-size:11px;font-weight:bold;padding:3px 7px;border-radius:5px}
.btn{background:#593B8B;color:#fff;border:none;padding:10px;border-radius:8px;width:100%;font-weight:bold;margin-top:8px}
.btn2{background:#fff;color:#593B8B;border:1px solid #593B8B}
.info{background:#eef6ff;padding:9px;border-radius:7px;font-size:12px;margin:10px 0;color:#004085}
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tab{flex:1;padding:8px;border:1px solid #ddd;background:#f8f9fa;border-radius:7px;font-weight:bold;font-size:12px}
.tab.on{background:#593B8B;color:#fff}
.card{border:1px solid #e2e2e8;border-radius:9px;padding:12px;margin-bottom:10px;background:#fafafa}
.card h3{margin:0 0 4px;font-size:14.5px}.dp{font-weight:bold;color:#16a34a;font-size:12.5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:14px}
.m-in{background:#fff;width:100%;max-width:380px;border-radius:10px;padding:15px}
input,textarea{width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
</style>
</head>
<body>
<div class="box">
  <div class="top"><h1>LokaServe</h1><span class="tag">Pi Mainnet</span></div>
  <div id="auth"><button class="btn" onclick="loginPi()">Masuk dengan Akun Pi</button></div>
  <div id="msg" class="info">Menyiapkan Pi SDK...</div>
  <div class="tabs">
    <button class="tab on" id="t1" onclick="tab(1)">Daftar Jasa</button>
    <button class="tab" id="t2" onclick="tab(2)">Pesanan (<span id="cnt">0</span>)</button>
  </div>
  <div id="p1">
    <div class="card"><h3>Servis &amp; Cuci AC</h3><p>Teknisi Sejuk Mandiri (★ 4.9)</p><div class="dp">DP: 0.5 Pi</div><button class="btn" onclick="buka('Cuci AC',0.5)">Pesan (0.5 Pi)</button></div>
    <div class="card"><h3>Jasa Tukang Harian</h3><p>Karya Tukang Lokal (★ 4.8)</p><div class="dp">DP: 1.0 Pi</div><button class="btn" onclick="buka('Tukang Harian',1.0)">Pesan (1.0 Pi)</button></div>
    <div class="card"><h3>Deep Cleaning Rumah</h3><p>BersihKilat Homecare (★ 4.9)</p><div class="dp">DP: 0.5 Pi</div><button class="btn" onclick="buka('Deep Cleaning',0.5)">Pesan (0.5 Pi)</button></div>
  </div>
  <div id="p2" style="display:none"><div id="list">Belum ada pesanan.</div></div>
</div>

<div class="modal" id="mod">
  <div class="m-in">
    <h3 id="mt" style="margin:0 0 8px;color:#593B8B">Pesan Jasa</h3>
    <input id="fn" placeholder="Nama Lengkap">
    <input id="fw" type="tel" placeholder="Nomor WhatsApp">
    <textarea id="fa" rows="2" placeholder="Alamat Lengkap"></textarea>
    <button class="btn" onclick="bayar()">Bayar via Pi Wallet</button>
    <button class="btn btn2" onclick="tutup()">Batal</button>
  </div>
</div>

<script>
var m=document.getElementById('msg'),u=null,sel={};

if(window.Pi){
  window.Pi.init({version:"2.0",sandbox:false});
  m.innerText="Sistem Pi Mainnet siap! Tekan Masuk dengan Akun Pi.";
}else{
  m.innerText="Buka lewat Pi Browser (tautan PiNet) agar tombol aktif.";
}

function tab(n){
  document.getElementById('t1').className=n==1?'tab on':'tab';
  document.getElementById('t2').className=n==2?'tab on':'tab';
  document.getElementById('p1').style.display=n==1?'block':'none';
  document.getElementById('p2').style.display=n==2?'block':'none';
  if(n==2)render();
}

function loginPi(){
  if(!window.Pi){alert("Buka lewat Pi Browser!");return}
  window.Pi.authenticate(['username','payments'],function(p){
    if(p.transaction && p.transaction.txid){
      fetch('/api/complete',{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})
      });
    }
  }).then(function(a){
    u=a.user;
    document.getElementById('auth').innerHTML='<div style="padding:8px;background:#e8f5e9;color:#1b5e20;border-radius:7px;text-align:center;font-weight:bold">@'+u.username+'</div>';
    m.innerText="Terhubung sebagai @"+u.username;
  }).catch(function(e){m.innerText="Gagal login: "+e});
}

function buka(j,p){
  if(!u){alert("Silakan Masuk dengan Akun Pi dulu!");return}
  sel={j:j,p:p};document.getElementById('mt').innerText=j+" ("+p+" Pi)";
  document.getElementById('mod').style.display='flex';
}

function tutup(){document.getElementById('mod').style.display='none'}

function bayar(){
  var fn=document.getElementById('fn').value,fw=document.getElementById('fw').value,fa=document.getElementById('fa').value;
  if(!fn||!fw||!fa){alert("Lengkapi data!");return}
  tutup();m.innerText="Membuka Pi Wallet...";
  window.Pi.createPayment({
    amount:sel.p,
    memo:"DP "+sel.j,
    metadata:{user:u.username,jasa:sel.j,nama:fn,wa:fw,alamat:fa}
  },{
    onReadyForServerApproval:async function(pid){
      m.innerText="Menyetujui transaksi...";
      await fetch('/api/approve',{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({paymentId:pid})
      });
    },
    onReadyForServerCompletion:async function(pid,tx){
      m.innerText="Menyelesaikan pembayaran...";
      await fetch('/api/complete',{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({paymentId:pid,txid:tx})
      });
      var ol=JSON.parse(localStorage.getItem('ls_o')||'[]');
      ol.unshift({j:sel.j,p:sel.p,fn:fn,tx:tx});
      localStorage.setItem('ls_o',JSON.stringify(ol));
      document.getElementById('cnt').innerText=ol.length;
      m.innerText="Pembayaran berhasil!";
      tab(2);
    },
    onCancel:function(){m.innerText="Pembayaran dibatalkan."},
    onError:function(e){m.innerText="Eror: "+(e.message||e)}
  });
}

function render(){
  var ol=JSON.parse(localStorage.getItem('ls_o')||'[]'),l=document.getElementById('list');
  if(!ol.length){l.innerHTML="Belum ada pesanan.";return}
  l.innerHTML=ol.map(function(o){return '<div class="card"><b>'+o.j+'</b> ('+o.p+' Pi)<br>Pemesan: '+o.fn+'<br><small>Tx: '+o.tx+'</small></div>'}).join('');
}
document.getElementById('cnt').innerText=JSON.parse(localStorage.getItem('ls_o')||'[]').length;
</script>
</body>
</html>
